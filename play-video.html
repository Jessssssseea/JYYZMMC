<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>宣传片 · 揭阳第一中学数模队</title>
    <link rel="icon" href="assets/images/logo.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-root: #06080d;
            --bg-surface: #0f1420;
            --accent-primary: #5b9bd5;
            --accent-glow: #7bb8e8;
            --text-primary: #e6ecf3;
            --text-secondary: #9aa9bb;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 24px;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 80px rgba(91, 155, 213, 0.2);
            --font-display: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display);
            background: var(--bg-root);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* 动态网格背景 */
        #grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.14;
            background-image:
                linear-gradient(rgba(91, 155, 213, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91, 155, 213, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid-drift 30s linear infinite;
        }
        @keyframes grid-drift {
            0% {
                background-position: 0 0, 0 0;
            }
            100% {
                background-position: 60px 60px, 60px 60px;
            }
        }

        /* 柔和光晕 */
        .glow-orb {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(200px);
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
            background: var(--accent-primary);
            top: 15%;
            left: 65%;
            animation: orb-float 20s ease-in-out infinite;
        }
        .glow-orb.second {
            background: #e8739a;
            top: 55%;
            left: 15%;
            width: 400px;
            height: 400px;
            opacity: 0.06;
            animation-delay: -8s;
        }
        @keyframes orb-float {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-60px, 40px) scale(1.15);
            }
            50% {
                transform: translate(30px, -30px) scale(0.9);
            }
            75% {
                transform: translate(-25px, -60px) scale(1.05);
            }
        }

        /* 主容器 */
        .player-wrapper {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* 返回链接 */
        .back-link {
            align-self: flex-start;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background: rgba(15, 20, 32, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
            margin-left: 1rem;
        }
        .back-link:hover {
            color: #fff;
            border-color: rgba(91, 155, 213, 0.5);
            background: rgba(91, 155, 213, 0.1);
            box-shadow: 0 0 25px rgba(91, 155, 213, 0.15);
            transform: translateX(-4px);
        }
        .back-link .arrow {
            display: inline-block;
            transition: var(--transition-smooth);
            font-size: 1.1rem;
        }
        .back-link:hover .arrow {
            transform: translateX(-3px);
        }

        /* 视频卡片 */
        .video-card {
            position: relative;
            width: 100%;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition-smooth);
            aspect-ratio: 16/9;
        }
        .video-card:hover {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 120px rgba(91, 155, 213, 0.2);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .video-card video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            background: #000;
        }

        /* 装饰性边框光晕 */
        .video-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius-lg) + 2px);
            padding: 2px;
            background: linear-gradient(135deg, rgba(91, 155, 213, 0.3), transparent 40%, transparent 60%, rgba(91, 155, 213, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
            animation: border-glow 4s linear infinite;
        }
        @keyframes border-glow {
            0% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.6;
            }
        }

        /* 标题 */
        .video-title {
            font-family: var(--font-display);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
            text-align: center;
            padding: 0 1rem;
        }
        .video-title span {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 页脚小字 */
        .footer-note {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            opacity: 0.6;
            z-index: 2;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .player-wrapper {
                width: 95%;
                gap: 1rem;
            }
            .back-link {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
                margin-left: 0;
            }
            .video-card {
                border-radius: 16px;
            }
            .video-card::before {
                border-radius: 18px;
            }
            .video-title {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding-top: 5rem;
            }
            .footer-note {
                bottom: 1rem;
                font-size: 0.65rem;
            }
        }

        /* 系统深浅色自适应模式 */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-root: #f8fafc;
                --bg-surface: #ffffff;
                --text-primary: #0f172a;
                --text-secondary: #334155;
                --border-subtle: rgba(0, 0, 0, 0.08);
                --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
                --shadow-glow: 0 0 80px rgba(91, 155, 213, 0.1);
            }

            body {
                background: var(--bg-root) !important;
            }

            /* 网格背景浅色适配 */
            #grid-bg {
                background-image:
                    linear-gradient(rgba(91, 155, 213, 0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(91, 155, 213, 0.06) 1px, transparent 1px);
                opacity: 0.12;
            }

            /* 光晕亮度弱化 */
            .glow-orb {
                opacity: 0.07;
            }
            .glow-orb.second {
                opacity: 0.05;
            }

            /* 返回按钮样式适配 */
            .back-link {
                background: rgba(255, 255, 255, 0.85) !important;
                color: var(--text-secondary) !important;
            }
            .back-link:hover {
                color: var(--accent-primary) !important;
                background: rgba(91, 155, 213, 0.08) !important;
            }

            /* 视频卡片底色边框 */
            .video-card {
                background: var(--bg-surface) !important;
                border-color: rgba(0, 0, 0, 0.1) !important;
            }

            /* 环形发光边框渐变适配 */
            .video-card::before {
                background: linear-gradient(135deg, rgba(91, 155, 213, 0.4), transparent 40%, transparent 60%, rgba(91, 155, 213, 0.4));
            }

            /* 页面标题文字 */
            .video-title {
                color: var(--text-primary) !important;
            }

            /* 页脚备注文字 */
            .footer-note {
                color: var(--text-muted) !important;
            }
        }
    </style>
</head>
<body>
    <!-- 背景元素 -->
    <div id="grid-bg"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb second"></div>

    <!-- 主播放器区域 -->
    <div class="player-wrapper">
        <a href="index.html#about" class="back-link">
            <span class="arrow">👈</span> 返回官网
        </a>

        <div class="video-card">
            <video controls autoplay playsinline>
                <source src="assets/videos/Promotional video.mp4" type="video/mp4">
                您的浏览器不支持 HTML5 视频播放，请升级浏览器。
            </video>
        </div>

    </div>

    <div class="footer-note">
        © 2026 揭阳第一中学数模队 · Model the World, Code the Future. · All rights reserved.
    </div>

    <script>
        const videoCard = document.querySelector('.video-card');
        const video = videoCard?.querySelector('video');
        if (videoCard && video) {
            videoCard.addEventListener('click', (e) => {
                // 如果用户点击的是控件本身，不处理
                if (e.target === video) return;
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        }

        // 键盘空格键控制播放/暂停
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && video && document.activeElement !== document.body) {
                e.preventDefault();
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        });
    </script>
</body>
</html>
