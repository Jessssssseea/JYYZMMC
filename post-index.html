<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数模队主页</title>
  <!-- 引入AOS滚动动画 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <style>
    /* 全局基础样式 */
    :root {
      --radius: 12px;
      --transition-smooth: all 0.4s ease;
      --transition-spring: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      --border-card: rgba(255,255,255,0.1);
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.15);
      --text-secondary: rgba(255,255,255,0.7);
      --font-display: 'Microsoft YaHei', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', sans-serif;
      color: #fff;
      background-color: #06080d;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 背景轮播容器 */
    .bg-carousel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .carousel-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .carousel-item.active {
      opacity: 1;
    }

    /* 渐变蒙版，保证文字清晰 */
    .carousel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(6, 8, 13, 0.85) 0%,
        rgba(10, 14, 23, 0.88) 50%,
        rgba(6, 8, 13, 0.92) 100%
      );
      z-index: 1;
    }

    /* 网格光效背景 */
    #grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(25,30,45,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(25,30,45,0.3) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
    }

    #glow-orb {
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(66,133,244,0.15) 0%, transparent 70%);
      top: 20%;
      left: 10%;
      z-index: -1;
      pointer-events: none;
    }

    #glow-orb.second {
      left: auto;
      right: 15%;
      top: 60%;
      background: radial-gradient(circle, rgba(255,109,0,0.12) 0%, transparent 70%);
    }

    /* 页面头部 */
    header {
      padding: 2rem 4vw;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #4285f4;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* 通用区块标题样式 */
    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-tag {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(66,133,244,0.15);
      color: #4285f4;
      border-radius: 50px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }

    .section-divider {
      width: 60px;
      height: 3px;
      background: #4285f4;
      margin: 0 auto 1rem;
      border-radius: 3px;
    }

    .section-subtitle {
      color: var(--text-secondary);
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* 照片墙样式 */
    #photo-wall {
      padding: 5rem 4vw;
      max-width: 1400px;
      margin: auto;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
    }

    .photo-item {
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .photo-img {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-sm);
    }

    .photo-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition-spring);
    }

    .photo-item:hover .photo-img img {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      transform: translateY(100%);
      transition: var(--transition-smooth);
    }

    .photo-item:hover .photo-caption {
      transform: translateY(0);
    }

    .photo-caption h4 {
      font-family: var(--font-display);
      font-size: 1rem;
      color: #fff;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .photo-caption p {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* 底部 */
    footer {
      text-align: center;
      padding: 3rem 4vw;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* 响应式适配 */
    @media (max-width: 900px) {
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1.2rem;
      }
    }

    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .photo-caption {
        padding: 0.8rem;
      }
      .section-header h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- 1. 全屏背景轮播 -->
  <div id="bg-carousel" class="bg-carousel">
    <div class="carousel-item active" style="background-image: url('assets/images/activities/bg1.jpg');"></div>
    <div class="carousel-item" style="background-image: url('assets/images/activities/bg2.jpg');"></div>
    <div class="carousel-item" style="background-image: url('assets/images/activities/bg3.jpg');"></div>
    <div class="carousel-overlay"></div>
  </div>

  <!-- 2. 网格+光效背景 -->
  <div id="grid-bg"></div>
  <div id="glow-orb"></div>
  <div id="glow-orb" class="second"></div>

  <!-- 3. 页面头部 -->
  <header>
    <div class="logo">数学建模协会</div>
    <p class="subtitle">用数学思维解决实际问题 · 用模型探索世界规律</p>
  </header>

  <!-- 4. 照片墙区块 -->
  <section id="photo-wall">
    <div class="section-header">
      <span class="section-tag">Photo Wall</span>
      <h2>数模队风采瞬间</h2>
      <div class="section-divider"></div>
      <p class="section-subtitle">记录数模队的成长、比赛、团建点滴，定格每一个精彩瞬间</p>
    </div>

    <div class="photo-grid">
      <div class="photo-item" data-aos="fade-up">
        <div class="photo-img">
          <img src="assets/images/activities/photo1.jpg" alt="数模队比赛现场">
          <div class="photo-caption">
            <h4>全国数模竞赛现场</h4>
            <p>2024年全国大学生数学建模竞赛备赛现场</p>
          </div>
        </div>
      </div>

      <div class="photo-item" data-aos="fade-up" data-aos-delay="100">
        <div class="photo-img">
          <img src="assets/images/activities/photo2.jpg" alt="团建活动">
          <div class="photo-caption">
            <h4>团队建设活动</h4>
            <p>2024届数模队户外团建，增强团队凝聚力</p>
          </div>
        </div>
      </div>

      <div class="photo-item" data-aos="fade-up" data-aos-delay="200">
        <div class="photo-img">
          <img src="assets/images/activities/photo3.jpg" alt="获奖合影">
          <div class="photo-caption">
            <h4>省级奖项颁奖</h4>
            <p>2024年广东省数学建模竞赛获奖合影</p>
          </div>
        </div>
      </div>

      <div class="photo-item" data-aos="fade-up" data-aos-delay="300">
        <div class="photo-img">
          <img src="assets/images/activities/photo4.jpg" alt="日常研讨">
          <div class="photo-caption">
            <h4>日常研讨交流</h4>
            <p>队员们日常研讨数学建模问题</p>
          </div>
        </div>
      </div>

      <div class="photo-item" data-aos="fade-up" data-aos-delay="400">
        <div class="photo-img">
          <img src="assets/images/activities/photo5.jpg" alt="招新宣讲">
          <div class="photo-caption">
            <h4>2024招新宣讲</h4>
            <p>面向新生的数模队招新宣讲会</p>
          </div>
        </div>
      </div>

      <div class="photo-item" data-aos="fade-up" data-aos-delay="500">
        <div class="photo-img">
          <img src="assets/images/activities/photo6.jpg" alt="校际交流">
          <div class="photo-caption">
            <h4>校际交流活动</h4>
            <p>与兄弟学校数模队交流学习</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. 页面底部 -->
  <footer>
    <p>© 2025 数学建模协会 版权所有</p>
  </footer>

  <!-- JS脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    // 初始化AOS滚动动画
    AOS.init({
      duration: 800,
      easing: 'ease-out',
      once: true
    });

    // 背景轮播自动切换
    const carouselItems = document.querySelectorAll('.carousel-item');
    let currentIndex = 0;

    function changeCarousel() {
      carouselItems[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % carouselItems.length;
      carouselItems[currentIndex].classList.add('active');
    }

    // 5秒切换一次
    setInterval(changeCarousel, 5000);
  </script>
</body>
</html>
